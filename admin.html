<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANJALI TRADERS Admin Panel</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="admin-panel">

<h1>🚗 ANJALI TRADERS Admin Panel</h1>

<input
type="text"
id="productName"
placeholder="Scooter Name">

<input
type="number"
id="productPrice"
placeholder="Price (₹)">

<input
type="text"
id="productBrand"
placeholder="Brand">

<input
type="text"
id="productOffer"
placeholder="Offer (Example: Free Helmet + Exchange Bonus)">

<textarea
id="productDescription"
placeholder="Description"></textarea>

<h3>Upload Images</h3>

<label>Image 1</label>
<input type="file" id="image1" accept="image/*">

<label>Image 2</label>
<input type="file" id="image2" accept="image/*">

<label>Image 3</label>
<input type="file" id="image3" accept="image/*">

<label>Image 4</label>
<input type="file" id="image4" accept="image/*">

<br><br>

<button onclick="uploadProduct()">
Upload Product
</button>

<hr>

<h2>All Products</h2>

<div id="adminProducts"></div>

</div>

<script type="module" src="firebase.js"></script>

</body>
</html>
